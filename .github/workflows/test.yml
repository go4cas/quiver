name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      update-screenshots:
        description: Re-capture the visual-parity baseline and commit it to this branch (refused on main)
        type: boolean
        default: false

permissions:
  contents: read

# The checks themselves live in checks.yml, a reusable workflow that publish.yml also runs
# on each release tag (audit S32-05, N230). This file adds the triggers and the manual
# baseline re-capture. Actions are pinned to full commit SHAs and the Playwright image to
# its digest (audit S05, N151); bump the image by hand in both files
# (starter/tests/visual/README.md, "Bumping Playwright").

jobs:
  # Unit, audit, e2e, browsers, pack and screenshots (checks.yml). A manual run with
  # update-screenshots skips the comparison, since the capture below replaces the baseline.
  checks:
    uses: ./.github/workflows/checks.yml
    permissions:
      contents: read
    with:
      screenshots: ${{ !inputs.update-screenshots }}

  # Manual run with update-screenshots, in two jobs (audit S05, N151). The capture job
  # installs dependencies and runs repository code with a read-only token and uploads
  # the baseline folder; the commit job installs and runs nothing, checks the artifact
  # holds only PNGs, and is the only job with a write token.
  screenshots-capture:
    if: ${{ inputs.update-screenshots && github.ref_name != 'main' }}
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble@sha256:eff16c30e6f3f4af0a03fa4b706120d5e9b0891c344a27d64559aff5900a4a27
      options: --ipc=host
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: apt-get update && apt-get install -y --no-install-recommends unzip   # setup-bun needs it
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.x
      - run: bun install --frozen-lockfile
      - name: Re-capture the baseline
        # only captures beyond the tolerance, so sub-threshold noise never churns PNGs
        run: bun run test:visual --update-snapshots=changed
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: visual-baseline
          path: starter/tests/visual/__screenshots__/
          if-no-files-found: error
          retention-days: 1

  screenshots-commit:
    needs: screenshots-capture
    if: ${{ inputs.update-screenshots && github.ref_name != 'main' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Replace the baseline with the captured one
        run: rm -rf starter/tests/visual/__screenshots__
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: visual-baseline
          path: starter/tests/visual/__screenshots__/
      - name: Commit the baseline
        run: |
          dir=starter/tests/visual/__screenshots__
          other=$(find "$dir" \( \( -type f ! -name '*.png' \) -o ! \( -type f -o -type d \) \) -print)
          if [ -n "$other" ]; then echo "::error::Artifact holds more than PNGs:"; echo "$other"; exit 1; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- "$dir"
          if git diff --cached --quiet; then echo "Baseline unchanged"; exit 0; fi
          git commit -m "test(visual): re-capture screenshot baseline on CI (${GITHUB_SHA::7})"
          git push origin "HEAD:$GITHUB_REF_NAME"
