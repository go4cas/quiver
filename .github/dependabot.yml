version: 2
updates:
  # ponytail: bun.lock is pinned to "lockfileVersion": 1 because Dependabot's bun
  # updater only reads v1 (Bun 1.4 writes v2 for new lockfiles, then keeps whatever
  # version it finds). If you regenerate the lockfile, set the marker back to 1.
  # Drop this note once dependabot-core reads lockfile v2.
  - package-ecosystem: bun
    directory: /
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    # The `screenshots` job runs in mcr.microsoft.com/playwright:v<version>-noble, which
    # must match @playwright/test exactly, and a new Chromium means re-capturing the
    # baseline. Dependabot can do neither, so bump Playwright by hand
    # (starter/tests/visual/README.md, "Bumping Playwright").
    ignore:
      - dependency-name: "@playwright/test"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
